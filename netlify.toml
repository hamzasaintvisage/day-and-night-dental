# Day Night Dental — Netlify deploy config
[build]
  command = "npm run build"
  publish = "dist"

# Vite 7 / vite-react-ssg need Node >= 20.19; pin a modern Node so the deploy build
# doesn't fail on an older default.
[build.environment]
  NODE_VERSION = "22"

# Serve /treatments/x from x.html and 301 the .html form to the clean URL,
# so the React Router clean routes always match after hydration.
[build.processing.html]
  pretty_urls = true

# --- Caching: content-hashed assets are immutable for a year ---
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# --- Security headers (baseline trust + HTTPS signals) ---
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    X-Frame-Options = "DENY"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com https://connect.facebook.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https://www.google-analytics.com https://region1.google-analytics.com https://www.googletagmanager.com https://connect.facebook.net https://www.facebook.com; frame-src https://www.google.com https://maps.google.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"

# --- Pretty /api/* path -> Netlify Functions (custom Resend email pipeline) ---
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

# --- Canonical host: 301 apex -> www (also set www primary + Force HTTPS in Netlify UI) ---
[[redirects]]
  from = "https://daynightdental.co.uk/*"
  to = "https://www.daynightdental.co.uk/:splat"
  status = 301
  force = true

# --- Scheduled function: daily health check of the email pipeline ---
[functions."healthcheck"]
  schedule = "@daily"
