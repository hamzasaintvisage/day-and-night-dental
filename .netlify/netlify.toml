functionsDirectory = "/Users/admin/Downloads/day-and-night-dental-recovered/netlify/functions"
functionsDirectoryOrigin = "default"
headersOrigin = "config"
redirectsOrigin = "config"
plugins = []

[build]
publish = "/Users/admin/Downloads/day-and-night-dental-recovered/dist"
publishOrigin = "config"
commandOrigin = "config"
command = "npm run build"
functions = "/Users/admin/Downloads/day-and-night-dental-recovered/netlify/functions"

[build.environment]
NODE_VERSION = "22"

[build.processing]

[build.processing.css]

[build.processing.html]
pretty_urls = true

[build.processing.images]

[build.processing.js]

[build.services]

[functions]

[functions.healthcheck]
schedule = "@daily"

[functions."*"]

[[headers]]
for = "/assets/*"

[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/*"

[headers.values]
Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[redirects]]
from = "/api/*"
to = "/.netlify/functions/:splat"
status = 200.0
force = true

[redirects.query]

[redirects.conditions]

[redirects.headers]

[[redirects]]
from = "https://dayandnightdental.co.uk/*"
to = "https://www.dayandnightdental.co.uk/:splat"
status = 301.0
force = true

[redirects.query]

[redirects.conditions]

[redirects.headers]