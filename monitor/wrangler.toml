# Day Night Dental enquiry-pipeline health monitor (standalone scheduled Worker).
# Separate from the website (Cloudflare Pages cannot run cron). Deploy at go-live — see
# the header of worker.js for the exact secret-set + deploy steps.
name = "daynightdental-healthcheck"
main = "worker.js"
compatibility_date = "2026-06-01"

# Daily at 09:00 UTC.
[triggers]
crons = ["0 9 * * *"]
