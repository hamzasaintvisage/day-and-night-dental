<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Where We Serve - Hairline Compass</title>
<style>
@font-face{font-family:'Fraunces';src:url('/fonts/fraunces.woff2') format('woff2');font-weight:100 900;font-display:swap;}
@font-face{font-family:'Inter Tight';src:url('/fonts/inter-tight.woff2') format('woff2');font-weight:100 900;font-display:swap;}
:root{--dn-day:#f8c760;--dn-night:#4590ec;--dn-night-soft:#6aa8f2;--dn-near-black:#0a0a0c;--dn-charcoal:#14141a;--dn-bone:#fff;--dn-bone-dim:rgba(255,255,255,.72);--dn-bone-faint:rgba(255,255,255,.5);--dn-mist:rgba(255,255,255,.1);--dn-r-card:16px;--container:1180px;--font-display:'Fraunces',Georgia,serif;--font-body:'Inter Tight',system-ui,sans-serif;}
*{box-sizing:border-box;} body{margin:0;background:var(--dn-near-black);color:var(--dn-bone);font-family:var(--font-body);line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden;}
img{max-width:100%;display:block;} a{color:inherit;}
.lab-top{position:sticky;top:0;z-index:60;display:flex;gap:1rem;align-items:center;justify-content:space-between;padding:12px 18px;background:rgba(10,10,12,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--dn-mist);font-size:.85rem;}
.lab-top a{color:var(--dn-bone-dim);text-decoration:none;} .lab-meta{display:flex;gap:.55rem;align-items:center;flex-wrap:wrap;} .lab-meta b{font-family:var(--font-display);font-weight:600;}
.lab-rank{font-family:var(--font-display);font-weight:700;color:var(--dn-day);} .lab-lens{font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;color:var(--dn-bone-faint);border:1px solid var(--dn-mist);border-radius:999px;padding:2px 9px;}
.dn-eyebrow.dn-pill{display:inline-flex;align-items:center;gap:9px;padding:7px 16px;border-radius:999px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.12);font-size:12px;letter-spacing:.22em;text-transform:uppercase;font-weight:600;}
.dn-eyebrow.dn-pill.day{color:var(--dn-day);} .dn-eyebrow.dn-pill.day::before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor;}
em.dn-hl-gold{font-style:normal;color:var(--dn-day);border-bottom:2px solid var(--dn-day);}

/* ============ Hairline Compass - ultra-minimal ============ */
/* One centred pin inside one thin hairline ring on a vast empty field. */
/* Quiet luxury, enormous negative space. No district list, no NAP card. */
.hc-stage{
  min-height:calc(100vh - 49px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;
  padding:clamp(48px,12vh,140px) 22px clamp(56px,10vh,120px);
  position:relative;
}
/* faint vertical meridian - a single quiet line through the whole field */
.hc-stage::before{
  content:'';position:absolute;top:0;bottom:0;left:50%;width:1px;
  background:linear-gradient(180deg,transparent,var(--dn-mist) 18%,var(--dn-mist) 82%,transparent);
  pointer-events:none;
}

.hc-eyebrow{margin-bottom:clamp(40px,9vh,96px);}

/* The compass - the single hero object */
.hc-compass{
  position:relative;
  width:clamp(248px,72vw,420px);
  aspect-ratio:1/1;
  display:flex;align-items:center;justify-content:center;
  margin:0 auto;
}
/* one thin hairline ring */
.hc-ring{
  position:absolute;inset:0;border-radius:50%;
  border:1px solid var(--dn-mist);
}
/* a second, almost invisible breath of a ring for depth - still hairline, still quiet */
.hc-ring.outer{inset:-26px;border-color:rgba(255,255,255,.05);}

/* the four cardinal hairline ticks on the ring (N E S W) */
.hc-tick{position:absolute;left:50%;top:50%;width:1px;height:9px;background:var(--dn-bone-faint);transform-origin:center;}
.hc-tick.n{transform:translate(-50%,-50%) translateY(calc(-1 * (clamp(124px,36vw,210px))));}
.hc-tick.s{transform:translate(-50%,-50%) translateY(clamp(124px,36vw,210px));}
.hc-tick.e{transform:translate(-50%,-50%) rotate(90deg) translateY(calc(-1 * (clamp(124px,36vw,210px))));}
.hc-tick.w{transform:translate(-50%,-50%) rotate(90deg) translateY(clamp(124px,36vw,210px));}

/* tiny N label - the only cardinal marked, the rest implied */
.hc-north{
  position:absolute;left:50%;top:0;transform:translate(-50%,-150%);
  font-size:.6rem;letter-spacing:.34em;color:var(--dn-bone-faint);font-weight:600;
}

/* the location pin - centred, gold */
.hc-pin{position:relative;width:34px;height:34px;display:block;}
.hc-pin svg{width:100%;height:100%;display:block;filter:drop-shadow(0 0 14px rgba(248,199,96,.5));}
/* continuous soft glow halo behind the pin */
.hc-pin::after{
  content:'';position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);
  width:120px;height:120px;border-radius:50%;
  background:radial-gradient(circle,rgba(248,199,96,.16),transparent 68%);
  pointer-events:none;z-index:-1;
}

/* headline below the compass - quiet luxury, refined display type */
.hc-head{
  font-family:var(--font-display);font-weight:340;
  font-size:clamp(1.85rem,6.4vw,3.1rem);line-height:1.12;letter-spacing:-.012em;
  margin:clamp(40px,8vh,82px) 0 0;max-width:16ch;
}
.hc-addr{
  margin:clamp(18px,3.2vh,26px) 0 0;
  font-size:clamp(.84rem,2.6vw,.96rem);letter-spacing:.02em;color:var(--dn-bone-dim);
}
.hc-addr .pc{color:var(--dn-bone-faint);}
.hc-tel{
  display:inline-flex;align-items:center;margin-top:14px;
  font-family:var(--font-display);font-weight:500;font-size:clamp(.92rem,3vw,1.05rem);
  color:var(--dn-day);text-decoration:none;letter-spacing:.01em;
  border-bottom:1px solid transparent;transition:border-color .25s ease;
  padding:4px 2px;min-height:44px;
}
.hc-tel:hover,.hc-tel:focus-visible{border-color:var(--dn-day);}

/* the two nearest stations - two tiny ticks, set far below, almost a whisper */
.hc-stations{
  margin-top:clamp(48px,11vh,118px);
  display:flex;gap:clamp(34px,9vw,72px);justify-content:center;align-items:flex-start;
  flex-wrap:wrap;
}
.hc-stn{
  display:flex;flex-direction:column;align-items:center;gap:9px;
  min-width:120px;
}
.hc-stn .mark{
  width:1px;height:22px;background:var(--dn-bone-faint);position:relative;
}
.hc-stn .mark::before{
  content:'';position:absolute;left:50%;top:0;transform:translateX(-50%);
  width:5px;height:5px;border-radius:50%;background:var(--dn-night-soft);
  box-shadow:0 0 8px rgba(106,168,242,.7);
}
.hc-stn .mins{
  font-family:var(--font-display);font-weight:500;font-size:1.02rem;color:var(--dn-bone);
}
.hc-stn .nm{
  font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;color:var(--dn-bone-faint);
}

.hc-foot{
  margin-top:clamp(40px,8vh,86px);
  font-size:.62rem;letter-spacing:.26em;text-transform:uppercase;color:var(--dn-bone-faint);
}
.hc-foot .dot{color:var(--dn-mist);margin:0 .55em;}

@media (max-width:380px){
  .hc-stations{gap:28px;}
  .hc-stn{min-width:108px;}
}
@media (prefers-reduced-motion:no-preference){
  .hc-pin svg{animation:hc-breathe 5.5s ease-in-out infinite;}
  @keyframes hc-breathe{0%,100%{filter:drop-shadow(0 0 12px rgba(248,199,96,.42));}50%{filter:drop-shadow(0 0 20px rgba(248,199,96,.62));}}
}
</style>
</head>
<body>
<div class="lab-top"><a href="/preview/">← all designs</a><div class="lab-meta"><span class="lab-rank">#NEW</span> <b>Hairline Compass</b> <span class="lab-lens">minimal</span></div><span></span></div>

<main class="hc-stage">
  <span class="dn-eyebrow dn-pill day hc-eyebrow">Where We Are</span>

  <div class="hc-compass" role="img" aria-label="Day Night Dental, marked at the centre of a compass on Hutcheson Street, Merchant City, Glasgow">
    <span class="hc-ring outer" aria-hidden="true"></span>
    <span class="hc-ring" aria-hidden="true"></span>
    <span class="hc-north" aria-hidden="true">N</span>
    <span class="hc-tick n" aria-hidden="true"></span>
    <span class="hc-tick e" aria-hidden="true"></span>
    <span class="hc-tick s" aria-hidden="true"></span>
    <span class="hc-tick w" aria-hidden="true"></span>
    <span class="hc-pin" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 1.5c-4.0 0-7.2 3.2-7.2 7.2 0 5.0 7.2 13.6 7.2 13.6s7.2-8.6 7.2-13.6c0-4.0-3.2-7.2-7.2-7.2z" fill="#f8c760"/>

  <p class="hc-addr">80 Hutcheson St, Merchant City, Glasgow <span class="pc">G1&nbsp;1SH</span></p>

  <div class="hc-stations">

</main>
</body>
</html>
