<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<style>
@font-face{font-family:'Fraunces';src:url('/fonts/fraunces.woff2') format('woff2');font-weight:100 900;font-display:swap;}
@font-face{font-family:'Inter Tight';src:url('/fonts/inter-tight.woff2') format('woff2');font-weight:100 900;font-display:swap;}
:root{--dn-day:#f8c760;--dn-night:#4590ec;--dn-night-soft:#6aa8f2;--dn-black:#000;--dn-near-black:#0a0a0c;--dn-charcoal:#14141a;--dn-bone:#fff;--dn-bone-dim:rgba(255,255,255,.72);--dn-bone-faint:rgba(255,255,255,.5);--dn-mist:rgba(255,255,255,.1);--dn-r-card:16px;--container:1180px;--font-display:'Fraunces',Georgia,serif;--font-body:'Inter Tight',system-ui,sans-serif;}
*{box-sizing:border-box;}
body{margin:0;background:var(--dn-near-black);color:var(--dn-bone);font-family:var(--font-body);line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden;}
img{max-width:100%;display:block;}
a{color:inherit;}
.lab-top{position:sticky;top:0;z-index:60;display:flex;gap:1rem;align-items:center;justify-content:space-between;padding:12px 18px;background:rgba(10,10,12,.86);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--dn-mist);font-size:.85rem;}
.lab-top a{color:var(--dn-bone-dim);text-decoration:none;}
.lab-top a:hover{color:var(--dn-bone);}
.lab-meta{display:flex;gap:.55rem;align-items:center;flex-wrap:wrap;}
.lab-meta b{font-family:var(--font-display);font-weight:600;}
.lab-rank{font-family:var(--font-display);font-weight:700;color:var(--dn-day);}
.lab-lens{font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;color:var(--dn-bone-faint);border:1px solid var(--dn-mist);border-radius:999px;padding:2px 9px;}
.lab-win{color:#0a0a0c;background:var(--dn-day);font-size:.58rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:2px 8px;border-radius:999px;}
.dn-eyebrow.dn-pill{display:inline-flex;align-items:center;gap:9px;padding:7px 16px;border-radius:999px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.12);font-size:12px;letter-spacing:.22em;text-transform:uppercase;font-weight:600;font-family:var(--font-body);}
.dn-eyebrow.dn-pill.day{color:var(--dn-day);}
.dn-eyebrow.dn-pill.night{color:var(--dn-night);}
.dn-eyebrow.dn-pill::before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor;}
em.dn-hl-gold{font-style:normal;color:var(--dn-day);}
em.dn-hl-blue{font-style:normal;color:var(--dn-night);}
</style>
<title>The Gold Standard - Real Smiles · Day Night Dental</title>
<style>
/* ============================================================
   THE GOLD STANDARD - statement lens
   One colossal hero smile, oversized serif, solid-gold index rail
   ============================================================ */

.dn-section{position:relative;padding:clamp(4rem,8vw,8rem) 0;}
.dn-container{width:100%;max-width:var(--container);margin:0 auto;padding:0 clamp(1.1rem,4vw,2.25rem);}

/* faint gold floor wash, single hue, no gradient across accents */
.dn-gallery-gold::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 90% at 80% 0%, rgba(248,199,96,.05), transparent 60%);
}

/* ---- the spread frame ---- */
.dn-gold-spread{
  position:relative;
  display:grid;
  grid-template-columns:minmax(280px,0.9fr) 1.6fr;
  gap:clamp(1.5rem,3vw,3rem);
  border:1px solid var(--dn-mist);
  border-radius:var(--dn-r-card);
  padding:clamp(1.5rem,3vw,2.75rem);
  margin-top:clamp(2.25rem,4vw,3rem);
  background:linear-gradient(180deg, rgba(255,255,255,.02), rgba(255,255,255,0));
}
/* single gold hairline framing the spread */
.dn-gold-spread::after{
  content:"";position:absolute;inset:7px;border-radius:calc(var(--dn-r-card) - 4px);
  border:1px solid color-mix(in srgb, var(--dn-day) 16%, transparent);
  pointer-events:none;
}

/* ---- masthead / headline column ---- */
.dn-gold-head{position:relative;align-self:start;}
.dn-gold-head .dn-eyebrow{margin-bottom:clamp(1.25rem,2.4vw,1.9rem);}
.dn-gold-kicker{
  font-family:var(--font-display);
  font-size:clamp(3rem,6vw,5.5rem);
  line-height:0.95;
  font-weight:600;
  letter-spacing:-0.01em;
  color:var(--dn-bone);
  margin:0;
}
.dn-gold-kicker em{
  font-style:normal;color:var(--dn-day);display:block;
  border-top:2px solid var(--dn-day);
  padding-top:.4rem;margin-top:.45rem;
}
.dn-gold-lead{
  margin:clamp(1.4rem,2.6vw,2rem) 0 0;
  max-width:32ch;color:var(--dn-bone-dim);font-size:1rem;
}
.dn-gold-count{
  display:flex;align-items:baseline;gap:.55rem;
  margin:clamp(1.6rem,3vw,2.25rem) 0 0;
  font-family:var(--font-display);font-size:1.5rem;
  color:var(--dn-bone-dim);font-variant-numeric:tabular-nums;
}
.dn-gold-count b{color:var(--dn-day);font-size:2.4rem;font-weight:600;line-height:1;}
.dn-gold-count .lab{
  font-family:var(--font-body);font-size:.62rem;letter-spacing:.22em;
  text-transform:uppercase;color:var(--dn-bone-faint);margin-left:.4rem;
}

/* ---- stage / hero column ---- */
.dn-gold-stage{min-width:0;}
.dn-gold-hero{
  position:relative;aspect-ratio:4/5;overflow:hidden;
  border-radius:var(--dn-r-card);background:var(--dn-near-black);
  border:1px solid var(--dn-mist);
}
.dn-gold-hero img{
  width:100%;height:100%;object-fit:cover;
  transition:opacity .5s ease, transform .9s cubic-bezier(.16,1,.3,1);
}
.dn-gold-hero.is-swapping img{opacity:0;}
/* readability scrim for the bottom caption plate */
.dn-gold-hero::before{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:1;
  background:linear-gradient(0deg, rgba(0,0,0,.78) 0%, rgba(0,0,0,.18) 34%, rgba(0,0,0,0) 56%);
}
/* solid-gold corner bracket - day side */
.dn-gold-hero::after{
  content:"";position:absolute;top:14px;right:14px;width:46px;height:46px;z-index:2;
  border-top:2px solid var(--dn-day);border-right:2px solid var(--dn-day);
  transition:border-color .4s ease;
}
.dn-gold-hero.night::after{border-top-color:var(--dn-night);border-right-color:var(--dn-night);}

/* bottom-anchored caption plate */
.dn-gold-cap{
  position:absolute;left:0;right:0;bottom:0;z-index:2;
  display:flex;flex-direction:column;gap:.55rem;
  padding:clamp(1.1rem,2.4vw,1.9rem);
}
.dn-gold-cap h3{
  margin:0;font-family:var(--font-display);font-weight:600;
  font-size:clamp(1.5rem,2.6vw,2.1rem);line-height:1.04;letter-spacing:-0.01em;
}
.dn-spot-tag{
  align-self:flex-start;
  font-size:.66rem;font-weight:600;letter-spacing:.2em;text-transform:uppercase;
  padding:.4rem .8rem;border-radius:999px;border:1px solid currentColor;
  background:rgba(10,10,12,.45);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
}
.dn-spot-tag.day{color:var(--dn-day);}
.dn-spot-tag.night{color:var(--dn-night-soft);}

/* ---- index rail of slim numbered slats ---- */
.dn-gold-rail{
  display:flex;gap:.7rem;margin-top:1rem;
  overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;
  scrollbar-width:none;padding-bottom:2px;
}
.dn-gold-rail::-webkit-scrollbar{display:none;}
.dn-gold-slat{
  --dn-gallery-accent:var(--dn-day);
  position:relative;flex:0 0 auto;scroll-snap-align:start;
  display:flex;align-items:center;gap:.6rem;min-height:48px;
  padding:.6rem .95rem;border:1px solid var(--dn-mist);border-radius:var(--dn-r-card);
  background:transparent;color:var(--dn-bone);
  font:inherit;font-size:.82rem;cursor:pointer;text-align:left;
  transition:border-color .25s, box-shadow .25s, background .25s, color .25s;
}
.dn-gold-slat.night{--dn-gallery-accent:var(--dn-night);}
.dn-gold-slat.on{
  border-color:var(--dn-gallery-accent);
  background:color-mix(in srgb, var(--dn-gallery-accent) 9%, transparent);
}
.dn-gold-slat:hover,.dn-gold-slat:focus-visible{
  border-color:var(--dn-gallery-accent);
  box-shadow:0 0 0 1.5px color-mix(in srgb, var(--dn-gallery-accent) 72%, transparent),
             0 0 26px -3px color-mix(in srgb, var(--dn-gallery-accent) 50%, transparent);
  outline:none;
}
.dn-gold-slat .n{
  font-family:var(--font-display);color:var(--dn-gallery-accent);
  font-weight:600;font-size:1.05rem;line-height:1;font-variant-numeric:tabular-nums;
}
.dn-gold-slat .lbl{display:flex;flex-direction:column;gap:1px;line-height:1.15;}
.dn-gold-slat .lbl .cat{
  font-size:.56rem;letter-spacing:.18em;text-transform:uppercase;color:var(--dn-bone-faint);
}
.dn-gold-slat .lbl .ttl{white-space:nowrap;color:var(--dn-bone-dim);}
.dn-gold-slat.on .lbl .ttl{color:var(--dn-bone);}

/* ---- CTA ---- */
.dn-gallery-cta{display:flex;justify-content:center;margin-top:clamp(2.5rem,4vw,3.5rem);}
.dn-btn{
  display:inline-flex;align-items:center;gap:.75rem;
  padding:1.1rem 2rem;font-family:var(--font-body);font-size:.82rem;font-weight:600;
  letter-spacing:.12em;text-transform:uppercase;
  border:1.5px solid var(--dn-day);background:var(--dn-day);color:var(--dn-black);
  border-radius:999px;text-decoration:none;cursor:pointer;min-height:44px;
  transition:transform .35s cubic-bezier(.16,1,.3,1), box-shadow .35s ease, filter .35s ease;
}
.dn-btn.primary:hover{
  transform:translateY(-2px);
  filter:brightness(1.04);
  box-shadow:0 0 0 1px color-mix(in srgb, var(--dn-day) 40%, transparent),
             0 18px 40px -18px color-mix(in srgb, var(--dn-day) 70%, transparent);
}
.dn-btn .arrow{transition:transform .3s ease;}
.dn-btn:hover .arrow{transform:translateX(4px);}

/* ---- responsive ---- */
@media (max-width:820px){
  .dn-gold-spread{grid-template-columns:1fr;padding:clamp(1.25rem,5vw,1.75rem);}
  .dn-gold-kicker{font-size:clamp(2.4rem,11vw,3.2rem);}
  .dn-gold-rail{margin-top:.85rem;}
  .dn-gold-count{margin-top:1.4rem;}
  .dn-gold-lead{max-width:none;}
}
@media (max-width:420px){
  .dn-gold-slat .lbl .cat{display:none;}
}
@media (prefers-reduced-motion:reduce){
  .dn-gold-hero img,.dn-btn,.dn-btn .arrow{transition:none;}
}
</style>
</head>
<body>
<div class="lab-top"><a href="/preview/">← all designs</a><div class="lab-meta"><span class="lab-rank">#4</span> <b>The Gold Standard</b> <span class="lab-lens">statement</span></div><span></span></div>

<section class="dn-section dn-gallery dn-gallery-gold">
  <div class="dn-container">
    <div class="dn-gold-spread">

      <div class="dn-gold-head">
        <span class="dn-eyebrow dn-pill day">Real Smiles</span>
        <h2 class="dn-gold-kicker">Real smiles,<em class="dn-hl-gold">real results</em></h2>
        <p class="dn-gold-lead">A look at the difference composite bonding, veneers, Invisalign and dental implants can make - one result at a time.</p>
        <p class="dn-gold-count" aria-live="polite">
          <b id="goldNow">01</b> <span>/ <span id="goldTotal">06</span></span>
          <span class="lab">The portfolio</span>
        </p>
      </div>

      <div class="dn-gold-stage">
        <figure class="dn-gold-hero day" id="goldHero">
          <img id="goldImg" src="/smiles/bonding-patient.webp" alt="Composite bonding, Day Night Dental, Glasgow" width="900" height="1100" decoding="async">
          <figcaption class="dn-gold-cap" id="goldCap">
            <span class="dn-spot-tag day" id="goldTag">Cosmetic</span>
            <h3 id="goldTitle">Composite bonding</h3>
          </figcaption>
        </figure>

        <div class="dn-gold-rail" role="tablist" aria-label="Real smile results">
          <button type="button" role="tab" aria-selected="true"  class="dn-gold-slat day on"   data-i="0" data-img="/smiles/bonding-patient.webp"   data-cat="Cosmetic"     data-cap="Composite bonding" data-side="day"><span class="n">01</span><span class="lbl"><span class="cat">Cosmetic</span><span class="ttl">Composite bonding</span></span></button>
          <button type="button" role="tab" aria-selected="false" class="dn-gold-slat night"     data-i="1" data-img="/smiles/bonding-patient-2.webp" data-cat="Cosmetic"     data-cap="Composite bonding" data-side="night"><span class="n">02</span><span class="lbl"><span class="cat">Cosmetic</span><span class="ttl">Composite bonding</span></span></button>
          <button type="button" role="tab" aria-selected="false" class="dn-gold-slat day"        data-i="2" data-img="/smiles/implant-patient.webp"    data-cat="Implants"     data-cap="Dental implants"   data-side="day"><span class="n">03</span><span class="lbl"><span class="cat">Implants</span><span class="ttl">Dental implants</span></span></button>
          <button type="button" role="tab" aria-selected="false" class="dn-gold-slat night"     data-i="3" data-img="/smiles/invisalign-patient.webp" data-cat="Orthodontics" data-cap="Invisalign"        data-side="night"><span class="n">04</span><span class="lbl"><span class="cat">Orthodontics</span><span class="ttl">Invisalign</span></span></button>
          <button type="button" role="tab" aria-selected="false" class="dn-gold-slat day"        data-i="4" data-img="/smiles/featured-smile.webp"     data-cat="Cosmetic"     data-cap="Porcelain veneers"  data-side="day"><span class="n">05</span><span class="lbl"><span class="cat">Cosmetic</span><span class="ttl">Porcelain veneers</span></span></button>
          <button type="button" role="tab" aria-selected="false" class="dn-gold-slat night"     data-i="5" data-img="/smiles/veneers-patient-2.webp"  data-cat="Cosmetic"     data-cap="Porcelain veneers"  data-side="night"><span class="n">06</span><span class="lbl"><span class="cat">Cosmetic</span><span class="ttl">Porcelain veneers</span></span></button>
        </div>
      </div>

    </div>

    <div class="dn-gallery-cta">
      <a href="#contact" class="dn-btn primary">Begin your transformation<span class="arrow">→</span></a>
    </div>
  </div>
</section>

<script>
(function(){
  var hero  = document.getElementById('goldHero');
  var img   = document.getElementById('goldImg');
  var tag   = document.getElementById('goldTag');
  var title = document.getElementById('goldTitle');
  var now   = document.getElementById('goldNow');
  var slats = Array.prototype.slice.call(document.querySelectorAll('.dn-gold-slat'));

  function pad(n){ return ('0' + n).slice(-2); }

  function select(slat){
    slats.forEach(function(s){
      var on = s === slat;
      s.classList.toggle('on', on);
      s.setAttribute('aria-selected', on ? 'true' : 'false');
    });
    var side = slat.getAttribute('data-side');
    var src  = slat.getAttribute('data-img');
    var cat  = slat.getAttribute('data-cat');
    var cap  = slat.getAttribute('data-cap');
    var i    = parseInt(slat.getAttribute('data-i'), 10);

    hero.classList.add('is-swapping');
    window.setTimeout(function(){
      img.src = src;
      img.alt = cap + ', Day Night Dental, Glasgow';
      hero.classList.remove('is-swapping');
    }, 180);

    hero.classList.toggle('night', side === 'night');
    hero.classList.toggle('day',   side === 'day');
    tag.className = 'dn-spot-tag ' + side;
    tag.textContent = cat;
    title.textContent = cap;
    now.textContent = pad(i + 1);
  }

  slats.forEach(function(slat){
    slat.addEventListener('click', function(){ select(slat); });
    slat.addEventListener('mouseenter', function(){ select(slat); });
    slat.addEventListener('focus', function(){ select(slat); });
  });
})();
</script>
