<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<style>
@font-face{font-family:'Fraunces';src:url('/fonts/fraunces.woff2') format('woff2');font-weight:100 900;font-display:swap;}
@font-face{font-family:'Inter Tight';src:url('/fonts/inter-tight.woff2') format('woff2');font-weight:100 900;font-display:swap;}
:root{--dn-day:#f8c760;--dn-night:#4590ec;--dn-night-soft:#6aa8f2;--dn-black:#000;--dn-near-black:#0a0a0c;--dn-charcoal:#14141a;--dn-bone:#fff;--dn-bone-dim:rgba(255,255,255,.72);--dn-bone-faint:rgba(255,255,255,.5);--dn-mist:rgba(255,255,255,.1);--dn-r-card:16px;--container:1180px;--font-display:'Fraunces',Georgia,serif;--font-body:'Inter Tight',system-ui,sans-serif;}
*{box-sizing:border-box;}
body{margin:0;background:var(--dn-near-black);color:var(--dn-bone);font-family:var(--font-body);line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden;}
img{max-width:100%;display:block;}
a{color:inherit;}
.lab-top{position:sticky;top:0;z-index:60;display:flex;gap:1rem;align-items:center;justify-content:space-between;padding:12px 18px;background:rgba(10,10,12,.86);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--dn-mist);font-size:.85rem;}
.lab-top a{color:var(--dn-bone-dim);text-decoration:none;}
.lab-top a:hover{color:var(--dn-bone);}
.lab-meta{display:flex;gap:.55rem;align-items:center;flex-wrap:wrap;}
.lab-meta b{font-family:var(--font-display);font-weight:600;}
.lab-rank{font-family:var(--font-display);font-weight:700;color:var(--dn-day);}
.lab-lens{font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;color:var(--dn-bone-faint);border:1px solid var(--dn-mist);border-radius:999px;padding:2px 9px;}
.lab-win{color:#0a0a0c;background:var(--dn-day);font-size:.58rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:2px 8px;border-radius:999px;}
.dn-eyebrow.dn-pill{display:inline-flex;align-items:center;gap:9px;padding:7px 16px;border-radius:999px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.12);font-size:12px;letter-spacing:.22em;text-transform:uppercase;font-weight:600;font-family:var(--font-body);}
.dn-eyebrow.dn-pill.day{color:var(--dn-day);}
.dn-eyebrow.dn-pill.night{color:var(--dn-night);}
.dn-eyebrow.dn-pill::before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor;}
em.dn-hl-gold{font-style:normal;color:var(--dn-day);}
em.dn-hl-blue{font-style:normal;color:var(--dn-night);}
</style>
<title>The Cinema Reel - Real Smiles · Day Night Dental</title>
<style>
/* ───────────────────────── THE CINEMA REEL ─────────────────────────
   Edge-to-edge cinematic stage: one giant smile, depth-of-field rail.
   Default state is fully visible/usable without JS (first plate live). */

.dn-section{position:relative;}
.dn-gallery-reel{
  padding:clamp(4rem,8vw,8rem) 0 clamp(4rem,7vw,7rem);
  background:
    radial-gradient(120% 80% at 50% -10%, rgba(248,199,96,.05), transparent 55%),
    var(--dn-near-black);
}
.dn-container{
  width:min(var(--container),100% - clamp(1.1rem,5vw,2.4rem) * 2);
  margin-inline:auto;
}

/* ── overlaid "credits" eyebrow + headline above the stage ── */
.dn-reel-intro{
  width:min(var(--container),100% - clamp(1.1rem,5vw,2.4rem) * 2);
  margin:0 auto clamp(1.6rem,3.4vw,2.6rem);
}
.dn-reel-intro .dn-display{
  font-family:var(--font-display);
  font-weight:340;
  font-size:clamp(2.1rem,5.2vw,3.9rem);
  line-height:1.02;
  letter-spacing:-.01em;
  margin:1rem 0 0;
}
.dn-reel-lead{
  margin:.9rem 0 0;
  max-width:46ch;
  color:var(--dn-bone-dim);
  font-size:clamp(.96rem,1.6vw,1.06rem);
}

/* ── full-bleed cinematic stage (breaks the container) ── */
.dn-reel-stage{
  position:relative;
  width:100vw;
  margin-inline:calc(50% - 50vw);
  padding-inline:clamp(0px,3vw,2.5rem);
}
.dn-reel-plate{
  --dn-reel-accent:var(--dn-day);
  position:relative;
  aspect-ratio:16/9;
  max-height:78vh;
  margin-inline:auto;
  max-width:1480px;
  overflow:hidden;
  border-radius:var(--dn-r-card);
  border:1px solid var(--dn-mist);
  background:var(--dn-near-black);
  box-shadow:
    0 0 0 1px color-mix(in srgb,var(--dn-reel-accent) 30%,transparent),
    0 40px 90px -40px color-mix(in srgb,var(--dn-reel-accent) 45%,transparent),
    0 30px 70px -30px rgba(0,0,0,.8);
}
.dn-reel-plate.night{--dn-reel-accent:var(--dn-night);}
.dn-reel-plate img{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  filter:grayscale(18%) brightness(.92) contrast(1.06);
  transition:filter .8s cubic-bezier(.16,1,.3,1),opacity .6s ease;
}
.dn-reel-plate.is-live img{filter:grayscale(0%) brightness(1) contrast(1);}

/* deep cinematic vignette so overlaid text is always legible */
.dn-reel-vignette{
  position:absolute;inset:0;pointer-events:none;
  background:
    linear-gradient(180deg, rgba(0,0,0,.62) 0%, rgba(0,0,0,0) 30%, rgba(0,0,0,0) 55%, rgba(0,0,0,.55) 100%),
    radial-gradient(140% 120% at 50% 42%, transparent 52%, rgba(0,0,0,.5) 100%);
}
/* soft accent floor-glow rising from the bottom edge */
.dn-reel-floor{
  position:absolute;inset:auto 0 0 0;height:46%;pointer-events:none;
  background:linear-gradient(0deg,
    color-mix(in srgb,var(--dn-reel-accent) 26%, transparent) 0%,
    rgba(0,0,0,.82) 30%,
    transparent 100%);
  mix-blend-mode:screen;
}

/* opening-credits title card, top-left over imagery */
.dn-reel-credit{
  position:absolute;
  top:clamp(1rem,3vw,2.2rem);
  left:clamp(1rem,3vw,2.4rem);
  max-width:60%;
  z-index:2;
}
.dn-reel-credit .dn-eyebrow{backdrop-filter:blur(4px);}
.dn-reel-credit .dn-credit-h{
  display:none;
  font-family:var(--font-display);
  font-weight:340;
  font-size:clamp(1.5rem,3.4vw,2.6rem);
  line-height:1.04;
  margin:.85rem 0 0;
  text-shadow:0 2px 26px rgba(0,0,0,.6);
}

/* bottom-left caption over the vignette */
.dn-reel-cap{
  position:absolute;
  left:clamp(1rem,3vw,2.4rem);
  bottom:clamp(1rem,3vw,2rem);
  z-index:2;
  display:flex;flex-direction:column;gap:.55rem;
}
.dn-spot-tag{
  align-self:flex-start;
  font-size:.66rem;letter-spacing:.2em;text-transform:uppercase;font-weight:600;
  padding:.36rem .7rem;border-radius:999px;
  border:1px solid color-mix(in srgb,var(--dn-reel-accent) 50%,transparent);
  background:rgba(10,10,12,.5);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
}
.dn-spot-tag.day{color:var(--dn-day);}
.dn-spot-tag.night{color:var(--dn-night-soft);}
.dn-reel-cap h3{
  margin:0;
  font-family:var(--font-display);
  font-weight:360;
  font-size:clamp(1.5rem,3.6vw,2.7rem);
  line-height:1;
  text-shadow:0 2px 24px rgba(0,0,0,.7);
}

/* ── depth-of-field rail beneath the stage ── */
.dn-reel-railwrap{
  width:min(var(--container),100% - clamp(1.1rem,5vw,2.4rem) * 2);
  margin:clamp(1.4rem,3vw,2.2rem) auto 0;
}
.dn-reel-rail{
  display:flex;gap:.75rem;overflow-x:auto;
  scroll-snap-type:x mandatory;
  padding:.4rem .1rem .6rem;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;
}
.dn-reel-rail::-webkit-scrollbar{display:none;}
.dn-reel-thumb{
  --dn-reel-accent:var(--dn-day);
  position:relative;
  flex:0 0 clamp(120px,16vw,200px);
  min-height:44px;
  aspect-ratio:4/5;
  scroll-snap-align:start;
  border:1px solid var(--dn-mist);
  border-radius:var(--dn-r-card);
  overflow:hidden;padding:0;margin:0;
  background:var(--dn-near-black);
  opacity:.42;filter:grayscale(60%);cursor:pointer;
  transition:opacity .4s,filter .4s,box-shadow .4s,border-color .4s,transform .4s cubic-bezier(.16,1,.3,1);
  color:inherit;
}
.dn-reel-thumb.night{--dn-reel-accent:var(--dn-night);}
.dn-reel-thumb img{width:100%;height:100%;object-fit:cover;}
.dn-reel-thumb .dn-reel-th-tag{
  position:absolute;left:8px;bottom:8px;z-index:2;
  font-size:.56rem;letter-spacing:.16em;text-transform:uppercase;font-weight:700;
  padding:.2rem .5rem;border-radius:999px;
  background:rgba(10,10,12,.62);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);
  opacity:0;transform:translateY(4px);transition:opacity .4s,transform .4s;
}
.dn-reel-thumb.day .dn-reel-th-tag{color:var(--dn-day);}
.dn-reel-thumb.night .dn-reel-th-tag{color:var(--dn-night-soft);}
.dn-reel-thumb::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,transparent 55%,rgba(0,0,0,.55) 100%);
  opacity:0;transition:opacity .4s;
}
@media(hover:hover){
  .dn-reel-thumb:hover{
    opacity:1;filter:none;transform:translateY(-3px);
    border-color:color-mix(in srgb,var(--dn-reel-accent) 82%,transparent);
    box-shadow:0 0 0 1.5px color-mix(in srgb,var(--dn-reel-accent) 75%,transparent),
               0 0 30px -2px color-mix(in srgb,var(--dn-reel-accent) 50%,transparent);
  }
  .dn-reel-thumb:hover .dn-reel-th-tag,
  .dn-reel-thumb:hover::after{opacity:1;transform:none;}
}
.dn-reel-thumb.on{
  opacity:1;filter:none;
  border-color:var(--dn-reel-accent);
  box-shadow:0 0 0 1.5px color-mix(in srgb,var(--dn-reel-accent) 75%,transparent),
             0 0 34px -2px color-mix(in srgb,var(--dn-reel-accent) 52%,transparent);
}
.dn-reel-thumb.on .dn-reel-th-tag,
.dn-reel-thumb.on::after{opacity:1;transform:none;}
.dn-reel-thumb:focus-visible{
  outline:2px solid var(--dn-reel-accent);outline-offset:3px;opacity:1;filter:none;
}

/* ── CTA ── */
.dn-gallery-cta{
  width:min(var(--container),100% - clamp(1.1rem,5vw,2.4rem) * 2);
  margin:clamp(2.4rem,5vw,3.6rem) auto 0;
  display:flex;justify-content:center;
}
.dn-btn{
  display:inline-flex;align-items:center;gap:.6rem;
  min-height:44px;padding:.95rem 1.6rem;border-radius:999px;
  font-family:var(--font-body);font-weight:600;font-size:1rem;
  text-decoration:none;cursor:pointer;border:1px solid transparent;
  transition:transform .25s cubic-bezier(.16,1,.3,1),box-shadow .25s,background .25s;
}
.dn-btn.primary{
  background:var(--dn-day);color:#0a0a0c;
  box-shadow:0 0 30px -6px color-mix(in srgb,var(--dn-day) 60%,transparent);
}
.dn-btn.primary:hover{
  transform:translateY(-2px);
  box-shadow:0 10px 34px -8px color-mix(in srgb,var(--dn-day) 70%,transparent);
}
.dn-btn .arrow{transition:transform .25s cubic-bezier(.16,1,.3,1);}
.dn-btn.primary:hover .arrow{transform:translateX(4px);}

/* ── mobile: full-bleed edge-to-edge plate, stacked credits ── */
@media(max-width:760px){
  .dn-reel-intro{display:none;}
  .dn-reel-stage{padding-inline:0;}
  .dn-reel-plate{
    aspect-ratio:4/5;max-height:none;border-radius:0;
    border-left:0;border-right:0;
  }
  .dn-reel-credit{max-width:78%;}
  .dn-reel-credit .dn-credit-h{display:block;}
  .dn-reel-cap h3{font-size:1.45rem;}
}
@media(prefers-reduced-motion:reduce){
  *{transition-duration:.001ms !important;}
}
</style>
</head>
<body>
<div class="lab-top"><a href="/preview/">← all designs</a><div class="lab-meta"><span class="lab-rank">#5</span> <b>The Cinema Reel</b> <span class="lab-lens">Immersive</span></div><span></span></div>

<section class="dn-section dn-gallery dn-gallery-reel" aria-labelledby="reel-heading">

  <!-- intro credits (desktop) -->
  <div class="dn-reel-intro">
    <span class="dn-eyebrow dn-pill day">Real Smiles</span>
    <h2 id="reel-heading" class="dn-display">Real smiles, <em class="dn-hl-gold">real results</em></h2>
    <p class="dn-reel-lead">A look at the difference composite bonding, veneers, Invisalign and dental implants can make - shown at full scale, like the day they walked out.</p>
  </div>

  <!-- full-bleed cinematic stage -->
  <div class="dn-reel-stage">
    <figure class="dn-reel-plate is-live day" id="reelPlate">
      <img id="reelImg"
           src="/smiles/bonding-patient.webp"
           alt="Composite bonding, Day Night Dental, Glasgow"
           width="1280" height="720" decoding="async" />
      <div class="dn-reel-vignette" aria-hidden="true"></div>
      <div class="dn-reel-floor" aria-hidden="true"></div>

      <div class="dn-reel-credit">
        <span class="dn-eyebrow dn-pill day">Real Smiles</span>
        <h3 class="dn-credit-h">Real smiles, <em class="dn-hl-gold">real results</em></h3>
      </div>

      <figcaption class="dn-reel-cap">
        <span class="dn-spot-tag day" id="reelTag">Cosmetic</span>
        <h3 id="reelTitle">Composite bonding</h3>
      </figcaption>
    </figure>
  </div>

  <!-- depth-of-field rail -->
  <div class="dn-reel-railwrap">
    <div class="dn-reel-rail" role="tablist" aria-label="Browse smile results">
      <button type="button" role="tab" aria-selected="true"  aria-label="Show Composite bonding" data-img="/smiles/bonding-patient.webp"   data-tag="Cosmetic"      data-title="Composite bonding" data-side="day"   class="dn-reel-thumb day on">
        <img src="/smiles/bonding-patient.webp" alt="" width="200" height="250" loading="lazy" decoding="async"><span class="dn-reel-th-tag">Cosmetic</span>
      </button>
      <button type="button" role="tab" aria-selected="false" aria-label="Show Composite bonding" data-img="/smiles/bonding-patient-2.webp" data-tag="Cosmetic"      data-title="Composite bonding" data-side="night" class="dn-reel-thumb night">
        <img src="/smiles/bonding-patient-2.webp" alt="" width="200" height="250" loading="lazy" decoding="async"><span class="dn-reel-th-tag">Cosmetic</span>
      </button>
      <button type="button" role="tab" aria-selected="false" aria-label="Show Dental implants" data-img="/smiles/implant-patient.webp"    data-tag="Implants"      data-title="Dental implants"   data-side="day"   class="dn-reel-thumb day">
        <img src="/smiles/implant-patient.webp" alt="" width="200" height="250" loading="lazy" decoding="async"><span class="dn-reel-th-tag">Implants</span>
      </button>
      <button type="button" role="tab" aria-selected="false" aria-label="Show Invisalign" data-img="/smiles/invisalign-patient.webp" data-tag="Orthodontics"  data-title="Invisalign"        data-side="night" class="dn-reel-thumb night">
        <img src="/smiles/invisalign-patient.webp" alt="" width="200" height="250" loading="lazy" decoding="async"><span class="dn-reel-th-tag">Orthodontics</span>
      </button>
      <button type="button" role="tab" aria-selected="false" aria-label="Show Porcelain veneers" data-img="/smiles/featured-smile.webp"    data-tag="Cosmetic"      data-title="Porcelain veneers" data-side="day"   class="dn-reel-thumb day">
        <img src="/smiles/featured-smile.webp" alt="" width="200" height="250" loading="lazy" decoding="async"><span class="dn-reel-th-tag">Cosmetic</span>
      </button>
      <button type="button" role="tab" aria-selected="false" aria-label="Show Porcelain veneers" data-img="/smiles/veneers-patient-2.webp" data-tag="Cosmetic"      data-title="Porcelain veneers" data-side="night" class="dn-reel-thumb night">
        <img src="/smiles/veneers-patient-2.webp" alt="" width="200" height="250" loading="lazy" decoding="async"><span class="dn-reel-th-tag">Cosmetic</span>
      </button>
    </div>
  </div>

  <div class="dn-gallery-cta">
    <a href="#contact" class="dn-btn primary">Begin your transformation <span class="arrow" aria-hidden="true">→</span></a>
  </div>
</section>

<script>
(function () {
  var rail   = document.querySelector('.dn-reel-rail');
  if (!rail) return;
  var thumbs = Array.prototype.slice.call(rail.querySelectorAll('.dn-reel-thumb'));
  var plate  = document.getElementById('reelPlate');
  var img    = document.getElementById('reelImg');
  var tag    = document.getElementById('reelTag');
  var title  = document.getElementById('reelTitle');
  var creditPills = document.querySelectorAll('.dn-reel-credit .dn-eyebrow, .dn-reel-intro .dn-eyebrow');

  function activate(btn) {
    if (!btn || btn.classList.contains('on')) return;
    var side = btn.getAttribute('data-side');

    // swap the feature plate with a quick cross-fade
    img.style.opacity = '0';
    window.setTimeout(function () {
      img.src = btn.getAttribute('data-img');
      var t = btn.getAttribute('data-title');
      img.alt = t + ', Day Night Dental, Glasgow';
      title.textContent = t;
      tag.textContent = btn.getAttribute('data-tag');
      tag.className = 'dn-spot-tag ' + side;
      plate.className = 'dn-reel-plate is-live ' + side;
      img.style.opacity = '1';
    }, 200);

    // update rail state
    thumbs.forEach(function (t) {
      var on = t === btn;
      t.classList.toggle('on', on);
      t.setAttribute('aria-selected', on ? 'true' : 'false');
    });
  }

  thumbs.forEach(function (btn) {
    btn.addEventListener('click', function () { activate(btn); });
    btn.addEventListener('mouseenter', function () { activate(btn); });
    // roving keyboard support across the rail
    btn.addEventListener('keydown', function (e) {
      var i = thumbs.indexOf(btn);
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
        e.preventDefault();
        var n = thumbs[(i + 1) % thumbs.length]; n.focus(); activate(n);
      } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
        e.preventDefault();
        var p = thumbs[(i - 1 + thumbs.length) % thumbs.length]; p.focus(); activate(p);
      }
    });
  });
})();
</script>
