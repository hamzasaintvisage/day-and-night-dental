<!DOCTYPE html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0c" />
    <!-- Mark JS available so the subtle scroll-reveal only applies with JS; failsafe reveals all
         sections if the bundle is slow or fails, so content is never left hidden. -->
    <script>
      document.documentElement.classList.add('dn-js');
      addEventListener('load', function () {
        setTimeout(function () {
          if (!document.querySelector('.dn-section.dn-in')) {
            document.querySelectorAll('.dn-section').forEach(function (s) { s.classList.add('dn-in'); });
          }
        }, 1600);
      });
    </script>
    <!-- robots is set per-route via vite-react-ssg <Head>: Layout default = index (with rich
         preview directives); noindex pages (thank-you/registered) override it by name. -->
    <!-- Google Search Console: paste your verification <meta name="google-site-verification" ...> tag here -->
    <!-- Bing Webmaster Tools verification meta tag can also go here -->


    <!-- Icons / PWA -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Self-hosted variable fonts (same origin, no Google round-trip), preloaded for fast text render -->
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/plus-jakarta-sans.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/inter-tight.woff2" />

    <!-- Per-route <title>/meta are injected by vite-react-ssg <Head>; no static title here to avoid duplicates. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
